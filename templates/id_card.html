<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>दिव्ययात्रा — VIP Tour Pass (Temple Edition)</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&family=Noto+Sans+Devanagari:wght@400;500;600;700;800&family=Cinzel:wght@400;600;700&display=swap" rel="stylesheet" />

  <style>
    /* ─────────────────────────────────────────────────────────
       PRINT ZONES
       Bleed  : 58mm × 90mm
       Cut    : 54mm × 86mm  (2mm inside bleed)
       Card   : 50mm × 82mm  (4mm inside bleed)
       Safe   : 48mm × 80mm  (5mm inside bleed / 1mm inside card)
    ─────────────────────────────────────────────────────────── */
    :root {
      --bleed-w: 58mm;   --bleed-h: 90mm;
      --cut-w:   54mm;   --cut-h:   86mm;
      --card-w:  50mm;   --card-h:  82mm;
      --safe-w:  48mm;   --safe-h:  80mm;

      /* ── Temple Colour Palette ── */
      --maroon:        #6b1010;
      --maroon-deep:   #4a0a0a;
      --maroon-mid:    #7d1515;
      --maroon-soft:   #8b2020;
      --saffron:       #e07b0a;
      --saffron-bright:#f59e0b;
      --saffron-pale:  rgba(224,123,10,0.15);
      --saffron-glow:  #fbbf24;
      --stone-light:   #e8d5b0;
      --stone-mid:     #d4bc8e;
      --stone-dark:    #b89a66;
      --stone-deep:    #8c7044;
      --cream:         #fdf3e3;
      --parchment:     #f5e6c8;
      --ink:           #2d1a06;
      --rule:          rgba(224,123,10,0.35);
      --ghost:         rgba(107,16,16,0.10);
    }

    @page {
      size: var(--bleed-w) var(--bleed-h);
      margin: 0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width:  var(--bleed-w);
      height: var(--bleed-h);
      background: #9e8c72;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Sora', sans-serif;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }

    /* ═══════════════════════════════════════════════════════
       BLEED — 58 × 90 mm  (temple sandstone base)
    ═══════════════════════════════════════════════════════ */
    .bleed {
      position: relative;
      width:  var(--bleed-w);
      height: var(--bleed-h);
      overflow: hidden;
      /* Sandstone gradient base */
      background:
        linear-gradient(160deg,
          #c9a96e 0%,
          #d4b87c 25%,
          #c8a96a 50%,
          #bf9e5e 75%,
          #b8935a 100%
        );
    }

    /* ── Stone texture overlay (repeating fine lines) ── */
    .bleed::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        repeating-linear-gradient(
          92deg,
          transparent 0px,
          transparent 3px,
          rgba(139,104,52,0.07) 3px,
          rgba(139,104,52,0.07) 4px
        ),
        repeating-linear-gradient(
          2deg,
          transparent 0px,
          transparent 7px,
          rgba(255,255,255,0.04) 7px,
          rgba(255,255,255,0.04) 8px
        );
      pointer-events: none;
      z-index: 0;
    }

    /* ── Vignette shadow at edges (stone depth) ── */
    .bleed::after {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(
        ellipse 80% 90% at 50% 50%,
        transparent 55%,
        rgba(60,30,10,0.28) 100%
      );
      pointer-events: none;
      z-index: 1;
    }

    .bg-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 2;
    }

    /* Cut-mark lines */
    .cut-h { position:absolute; left:0; right:0; height:.15mm; background:rgba(107,16,16,0.15); z-index:10; }
    .cut-v { position:absolute; top:0; bottom:0; width:.15mm;  background:rgba(107,16,16,0.15); z-index:10; }
    .cut-top    { top: 2mm; }
    .cut-bottom { bottom: 2mm; }
    .cut-left   { left: 2mm; }
    .cut-right  { right: 2mm; }

    /* ═══════════════════════════════════════════════════════
       CARD — 50 × 82 mm
    ═══════════════════════════════════════════════════════ */
    .card {
      position: absolute;
      width:  var(--card-w);
      height: var(--card-h);
      top:  4mm;
      left: 4mm;
      z-index: 5;
    }

    /* Card outline: thin maroon border */
    .card::before {
      content: '';
      position: absolute;
      inset: 0;
      border: .4mm solid rgba(107,16,16,0.45);
      border-radius: .6mm;
      pointer-events: none;
      z-index: 20;
    }

    /* Outer glow on card edges */
    .card::after {
      content: '';
      position: absolute;
      inset: -.4mm;
      border: .4mm solid rgba(224,123,10,0.20);
      border-radius: 1mm;
      pointer-events: none;
      z-index: 19;
    }

    /* ── Temple corner ornaments ── */
    .corner-ornament {
      position: absolute;
      width: 5mm;
      height: 5mm;
      pointer-events: none;
      z-index: 22;
    }
    .co-tl { top: .5mm;    left: .5mm;  }
    .co-tr { top: .5mm;    right: .5mm; transform: scaleX(-1); }
    .co-bl { bottom: .5mm; left: .5mm;  transform: scaleY(-1); }
    .co-br { bottom: .5mm; right: .5mm; transform: scale(-1,-1); }

    /* ═══════════════════════════════════════════════════════
       SAFE — 48 × 80 mm
    ═══════════════════════════════════════════════════════ */
    .safe {
      position: absolute;
      width:  var(--safe-w);
      height: var(--safe-h);
      top:  1mm;
      left: 1mm;
    }

    /* ─────────────────────────────────────────────────────
       1. HEADER  (height ~11mm)
    ───────────────────────────────────────────────────── */
    .header {
      position: absolute;
      top: 0; left: 0;
      width: 48mm;
      height: 11mm;
      overflow: hidden;
      background:
        linear-gradient(150deg,
          #4a0a0a 0%,
          #6b1010 40%,
          #7d1515 70%,
          #5c0e0e 100%
        );
      border-bottom: .5mm solid var(--saffron);
    }

    /* Stone texture on header */
    .header::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        repeating-linear-gradient(
          180deg,
          transparent 0, transparent 1.8mm,
          rgba(255,255,255,0.03) 1.8mm, rgba(255,255,255,0.03) 2mm
        );
    }

    /* Saffron accent stripe at very top */
    .header::after {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: .6mm;
      background: linear-gradient(90deg,
        transparent 0%,
        var(--saffron) 20%,
        var(--saffron-bright) 50%,
        var(--saffron) 80%,
        transparent 100%
      );
    }

    .header-inner {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      padding: 1.2mm 2mm 1mm;
      gap: .4mm;
    }

    .header-diya {
      font-size: 5pt;
      line-height: 1;
      opacity: .85;
    }

    .header-hindi {
      font-family: 'Noto Sans Devanagari', sans-serif;
      font-size: 7pt;
      font-weight: 800;
      color: var(--saffron-glow);
      letter-spacing: .3mm;
      line-height: 1;
      text-shadow:
        0 0 3mm rgba(251,191,36,.6),
        0 .3mm .8mm rgba(0,0,0,.5);
    }

    .header-divider {
      display: flex;
      align-items: center;
      gap: 1.5mm;
      width: 100%;
      justify-content: center;
    }
    .header-divider-line {
      flex: 1;
      height: .2mm;
      background: linear-gradient(90deg, transparent, rgba(251,191,36,.5), transparent);
    }
    .header-divider-dot {
      width: .8mm; height: .8mm;
      border-radius: 50%;
      background: var(--saffron-bright);
      opacity: .7;
    }

    .header-label {
      font-family: 'Cinzel', serif;
      font-size: 3pt;
      font-weight: 600;
      color: rgba(255,255,255,.75);
      letter-spacing: 1.5mm;
      text-transform: uppercase;
    }

    /* ─────────────────────────────────────────────────────
       2. PHOTO SECTION  (top: 12.5mm)
    ───────────────────────────────────────────────────── */
    .photo-section {
      position: absolute;
      top: 12.5mm;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: .8mm;
    }

    /* Decorative arch above photo (temple torana) */
    .photo-torana {
      width: 22mm;
      height: 3mm;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1mm;
    }
    .torana-line {
      flex: 1;
      height: .25mm;
      background: linear-gradient(90deg, transparent, var(--saffron), transparent);
    }
    .torana-om {
      font-size: 4.5pt;
      color: var(--saffron-bright);
      line-height: 1;
      text-shadow: 0 0 2mm rgba(251,191,36,.4);
    }

    .photo-frame {
      width: 19mm;
      height: 23mm;
      border-radius: 1mm;
      overflow: hidden;
      position: relative;
      /* Layered border: saffron outer, maroon inner */
      box-shadow:
        0 0 0 .5mm var(--saffron),
        0 0 0 1mm var(--maroon-soft),
        0 0 0 1.5mm rgba(224,123,10,.25),
        0 1mm 3mm rgba(74,10,10,.4);
    }

    /* Inner stone light reflection */
    .photo-frame::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(145deg,
        rgba(255,240,200,.12) 0%,
        transparent 55%
      );
      z-index: 2;
      pointer-events: none;
    }

    #card-photo {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      position: relative;
      z-index: 1;
    }

    .photo-placeholder {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(160deg, #e8d5b0 0%, #d4bc8e 100%);
      gap: .8mm;
      z-index: 0;
    }

    .photo-placeholder svg { opacity: .30; }

    .photo-placeholder-text {
      font-size: 2.3pt;
      font-weight: 600;
      color: var(--maroon-deep);
      letter-spacing: .3mm;
      text-transform: uppercase;
      opacity: .5;
    }

    .pilgrim-badge {
      display: inline-flex;
      align-items: center;
      gap: .5mm;
      padding: .4mm 2.2mm;
      background: linear-gradient(90deg,
        var(--maroon-deep),
        var(--maroon-soft),
        var(--maroon-deep)
      );
      border: .3mm solid var(--saffron);
      border-radius: .6mm;
      font-family: 'Cinzel', serif;
      font-size: 2.8pt;
      font-weight: 700;
      color: var(--saffron-bright);
      letter-spacing: .8mm;
      text-transform: uppercase;
      box-shadow: 0 .3mm 1.5mm rgba(74,10,10,.5);
    }

    /* ─────────────────────────────────────────────────────
       Ornamental divider strip  (top: ~38.5mm)
    ───────────────────────────────────────────────────── */
    .ornament-strip {
      position: absolute;
      top: 38.5mm;
      left: 0; right: 0;
      height: 3.5mm;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: .8mm;
      padding: 0 1.5mm;
    }

    .ornament-line {
      flex: 1;
      height: .3mm;
      background: linear-gradient(90deg,
        transparent,
        var(--saffron) 30%,
        var(--saffron) 70%,
        transparent
      );
    }

    .ornament-lotus {
      font-size: 5.5pt;
      color: var(--saffron-bright);
      line-height: 1;
      text-shadow: 0 0 1.5mm rgba(224,123,10,.4);
    }

    /* ─────────────────────────────────────────────────────
       3. DETAILS  (top: ~42.5mm, height ~17.5mm)
    ───────────────────────────────────────────────────── */
    .details {
      position: absolute;
      top: 42.5mm;
      left: .5mm;
      right: .5mm;
      background: rgba(253,243,227,0.82);
      border: .3mm solid rgba(107,16,16,0.30);
      border-radius: .8mm;
      padding: 1.3mm 1.8mm;
      box-shadow:
        inset 0 .3mm .8mm rgba(255,255,255,0.6),
        0 .3mm 1.2mm rgba(74,10,10,.20);
    }

    /* Parchment inner texture */
    .details::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: .8mm;
      background: repeating-linear-gradient(
        180deg,
        transparent,
        transparent 3mm,
        rgba(176,140,90,0.06) 3mm,
        rgba(176,140,90,0.06) 3.15mm
      );
      pointer-events: none;
    }

    .field { margin-bottom: .85mm; position: relative; z-index: 1; }
    .field:last-child { margin-bottom: 0; }

    .field-label {
      display: block;
      font-size: 2.2pt;
      font-weight: 700;
      color: var(--maroon);
      text-transform: uppercase;
      letter-spacing: .55mm;
      line-height: 1;
      margin-bottom: .2mm;
    }

    .field-value {
      display: block;
      font-size: 3.8pt;
      font-weight: 600;
      color: var(--ink);
      line-height: 1.15;
    }

    #card-name {
      font-size: 5pt;
      font-weight: 700;
      color: var(--maroon-deep);
    }

    .field-hr {
      height: .2mm;
      background: linear-gradient(90deg,
        transparent,
        rgba(107,16,16,0.2) 20%,
        rgba(107,16,16,0.2) 80%,
        transparent
      );
      margin: .7mm 0;
      position: relative;
      z-index: 1;
    }

    .field-row { display: flex; gap: 1.5mm; }
    .field-row .field { flex: 1; }

    /* ─────────────────────────────────────────────────────
       4. FOOTER / QR  (bottom: 0, height 17mm)
    ───────────────────────────────────────────────────── */
    .footer {
      position: absolute;
      bottom: 0;
      left: 0; right: 0;
      height: 17mm;
      border-top: .35mm solid rgba(107,16,16,0.30);
      padding: 1.3mm 2mm 1.2mm;
      display: flex;
      align-items: center;
      gap: 2mm;
      background: linear-gradient(180deg,
        rgba(253,243,227,.0) 0%,
        rgba(253,243,227,.50) 100%
      );
    }

    .qr-frame {
      width: 13mm;
      height: 13mm;
      flex-shrink: 0;
      border-radius: .7mm;
      overflow: hidden;
      background: #fff;
      position: relative;
      box-shadow:
        0 0 0 .4mm var(--maroon),
        0 0 0 .8mm var(--saffron),
        0 .3mm 1.5mm rgba(74,10,10,.35);
    }

    #card-qr {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      position: relative;
      z-index: 1;
    }

    .qr-placeholder-svg {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fffaf4;
      z-index: 0;
    }

    .footer-info { flex: 1; }

    .footer-title {
      display: block;
      font-family: 'Cinzel', serif;
      font-size: 3pt;
      font-weight: 700;
      color: var(--maroon-deep);
      text-transform: uppercase;
      letter-spacing: .3mm;
      line-height: 1.3;
    }

    .footer-body {
      display: block;
      font-size: 2.3pt;
      color: rgba(45,26,6,.55);
      line-height: 1.45;
      margin-top: .4mm;
    }

    .footer-brand {
      display: flex;
      align-items: center;
      gap: .6mm;
      margin-top: 1.2mm;
    }

    .footer-brand-hr {
      flex: 1;
      height: .2mm;
      background: linear-gradient(90deg, rgba(107,16,16,.25), transparent);
    }

    .footer-brand-text {
      font-family: 'Noto Sans Devanagari', sans-serif;
      font-size: 2.8pt;
      font-weight: 700;
      color: var(--maroon);
      opacity: .55;
      letter-spacing: .1mm;
    }

    /* ── Screen-only ── */
    @media screen {
      body {
        min-height: 100vh;
        background: #9e8c72;
      }
      .bleed {
        box-shadow:
          0 3mm 12mm rgba(60,30,10,.5),
          0 1mm 4mm  rgba(60,30,10,.30);
      }
    }
    @media print {
      body { background: none !important; }
      .cut-h, .cut-v { opacity: 0; }
    }
  </style>
</head>
<body>

<!-- ╔══════════════════════════════════════════╗
     ║  BLEED ZONE  58 × 90 mm                 ║
     ╚══════════════════════════════════════════╝ -->
<div class="bleed">

  <!-- Temple stone decorative SVG (full bleed) -->
  <svg class="bg-svg" viewBox="0 0 219 340" xmlns="http://www.w3.org/2000/svg"
       preserveAspectRatio="xMidYMid slice">

    <!-- Top shikhara-inspired geometry -->
    <g opacity=".09" fill="none" stroke="#6b1010" stroke-width="1.0">
      <!-- Concentric temple tower rings — top right -->
      <path d="M219 0 L175 60 L219 60 Z" stroke-width=".7" fill="rgba(107,16,16,.04)"/>
      <path d="M219 0 L155 80 L219 80 Z" stroke-width=".5" fill="rgba(107,16,16,.03)"/>
      <circle cx="200" cy="30" r="35" stroke-width=".8"/>
      <circle cx="200" cy="30" r="22" stroke-width=".6"/>
      <circle cx="200" cy="30" r="10" stroke-width=".5"/>
    </g>

    <!-- Bottom left kumbha (kalash pot) motif -->
    <g opacity=".08" fill="none" stroke="#6b1010" stroke-width="1.0">
      <circle cx="22" cy="300" r="32"/>
      <circle cx="22" cy="300" r="20"/>
      <circle cx="22" cy="300" r="10"/>
      <!-- Radiating petals -->
      <line x1="22" y1="268" x2="22" y2="332"/>
      <line x1="-10" y1="300" x2="54" y2="300"/>
      <line x1="0"  y1="277" x2="44" y2="323"/>
      <line x1="44" y1="277" x2="0"  y2="323"/>
    </g>

    <!-- Saffron floral border top -->
    <g opacity=".07" fill="#e07b0a">
      <rect x="0"  y="0" width="219" height="2"/>
      <rect x="0"  y="3" width="219" height=".5"/>
    </g>

    <!-- Saffron floral border bottom -->
    <g opacity=".07" fill="#e07b0a">
      <rect x="0" y="338" width="219" height="2"/>
      <rect x="0" y="336.5" width="219" height=".5"/>
    </g>

    <!-- Subtle diagonal stone grain (left side) -->
    <g opacity=".04" stroke="#8c7044" stroke-width=".8">
      <line x1="0"  y1="100" x2="30"  y2="80"/>
      <line x1="0"  y1="120" x2="40"  y2="95"/>
      <line x1="0"  y1="140" x2="35"  y2="118"/>
      <line x1="0"  y1="160" x2="28"  y2="142"/>
      <line x1="0"  y1="200" x2="45"  y2="178"/>
    </g>

    <!-- Petal dot pattern — top left area -->
    <g fill="#6b1010" opacity=".08">
      <circle cx="8"   cy="20"  r="1.2"/>
      <circle cx="16"  cy="20"  r="1.2"/>
      <circle cx="24"  cy="20"  r="1.2"/>
      <circle cx="12"  cy="27"  r="1.2"/>
      <circle cx="20"  cy="27"  r="1.2"/>
    </g>

    <!-- Petal dot pattern — bottom right area -->
    <g fill="#6b1010" opacity=".08">
      <circle cx="195" cy="315" r="1.2"/>
      <circle cx="203" cy="315" r="1.2"/>
      <circle cx="211" cy="315" r="1.2"/>
      <circle cx="199" cy="322" r="1.2"/>
      <circle cx="207" cy="322" r="1.2"/>
    </g>

    <!-- Decorative lotus petal SVG — center bg -->
    <g opacity=".045" fill="none" stroke="#6b1010" stroke-width=".9"
       transform="translate(109,170)">
      <ellipse rx="18" ry="28" transform="rotate(0)"/>
      <ellipse rx="18" ry="28" transform="rotate(45)"/>
      <ellipse rx="18" ry="28" transform="rotate(90)"/>
      <ellipse rx="18" ry="28" transform="rotate(135)"/>
      <circle r="8" stroke-width=".7"/>
    </g>

    <!-- Fine horizontal stone layer lines across full width -->
    <g opacity=".04" stroke="#8c7044" stroke-width=".6">
      <line x1="0" y1="110" x2="219" y2="110"/>
      <line x1="0" y1="170" x2="219" y2="170"/>
      <line x1="0" y1="230" x2="219" y2="230"/>
    </g>
  </svg>

  <!-- Cut-mark lines -->
  <div class="cut-h cut-top"></div>
  <div class="cut-h cut-bottom"></div>
  <div class="cut-v cut-left"></div>
  <div class="cut-v cut-right"></div>

  <!-- ╔══════════════════════════════════════╗
       ║  CARD — 50 × 82 mm                  ║
       ╚══════════════════════════════════════╝ -->
  <div class="card">

    <!-- Temple corner ornaments (SVG) -->
    <svg class="corner-ornament co-tl" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg">
      <path d="M2 16 L2 2 L16 2" fill="none" stroke="#e07b0a" stroke-width="1.6" stroke-linecap="round"/>
      <path d="M2 8 L8 2" fill="none" stroke="#e07b0a" stroke-width=".9" stroke-linecap="round" opacity=".6"/>
      <circle cx="2" cy="2" r="1.4" fill="#e07b0a"/>
    </svg>
    <svg class="corner-ornament co-tr" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg">
      <path d="M2 16 L2 2 L16 2" fill="none" stroke="#e07b0a" stroke-width="1.6" stroke-linecap="round"/>
      <path d="M2 8 L8 2" fill="none" stroke="#e07b0a" stroke-width=".9" stroke-linecap="round" opacity=".6"/>
      <circle cx="2" cy="2" r="1.4" fill="#e07b0a"/>
    </svg>
    <svg class="corner-ornament co-bl" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg">
      <path d="M2 16 L2 2 L16 2" fill="none" stroke="#e07b0a" stroke-width="1.6" stroke-linecap="round"/>
      <path d="M2 8 L8 2" fill="none" stroke="#e07b0a" stroke-width=".9" stroke-linecap="round" opacity=".6"/>
      <circle cx="2" cy="2" r="1.4" fill="#e07b0a"/>
    </svg>
    <svg class="corner-ornament co-br" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg">
      <path d="M2 16 L2 2 L16 2" fill="none" stroke="#e07b0a" stroke-width="1.6" stroke-linecap="round"/>
      <path d="M2 8 L8 2" fill="none" stroke="#e07b0a" stroke-width=".9" stroke-linecap="round" opacity=".6"/>
      <circle cx="2" cy="2" r="1.4" fill="#e07b0a"/>
    </svg>

    <!-- ╔══════════════════════════════════════╗
         ║  SAFE — 48 × 80 mm                  ║
         ╚══════════════════════════════════════╝ -->
    <div class="safe">

      <!-- ─── 1. HEADER ─── -->
      <div class="header">
        <div class="header-inner">
          <span class="header-diya">🕉</span>
          <span class="header-hindi">दिव्ययात्रा</span>
          <div class="header-divider">
            <span class="header-divider-line"></span>
            <span class="header-divider-dot"></span>
            <span class="header-divider-dot"></span>
            <span class="header-divider-dot"></span>
            <span class="header-divider-line"></span>
          </div>
          <span class="header-label">Tour&nbsp;&nbsp;&nbsp;Pass</span>
        </div>
      </div>

      <!-- ─── 2. PHOTO ─── -->
      <div class="photo-section">
        <div class="photo-torana">
          <span class="torana-line"></span>
          <span class="torana-om">ॐ</span>
          <span class="torana-line"></span>
        </div>
        <div class="photo-frame">
          <img id="card-photo" src="" alt="Passenger Photo"
               onerror="this.style.display='none'" />
          <div class="photo-placeholder">
            <svg width="26" height="28" viewBox="0 0 28 30" fill="#6b1010" xmlns="http://www.w3.org/2000/svg">
              <circle cx="14" cy="9" r="7.5" fill="#7d1515"/>
              <path d="M0 28c0-7.732 6.268-14 14-14s14 6.268 14 14" fill="#7d1515"/>
            </svg>
            <span class="photo-placeholder-text">Photo</span>
          </div>
        </div>
        <div class="pilgrim-badge">✦&nbsp;Pilgrim&nbsp;✦</div>
      </div>

      <!-- ─── Ornament strip ─── -->
      <div class="ornament-strip">
        <span class="ornament-line"></span>
        <span class="ornament-lotus">🪷</span>
        <span class="ornament-line"></span>
      </div>

      <!-- ─── 3. DETAILS ─── -->
      <div class="details">
        <div class="field">
          <span class="field-label">Full Name</span>
          <span class="field-value" id="card-name">Passenger Name</span>
        </div>
        <div class="field-hr"></div>
        <div class="field">
          <span class="field-label">Tour Group</span>
          <span class="field-value" id="card-group">Group A – Kashi Yatra</span>
        </div>
        <div class="field-hr"></div>
        <div class="field-row">
          <div class="field">
            <span class="field-label">Age / City</span>
            <span class="field-value" id="card-age-city">45 / Nagpur</span>
          </div>
          <div class="field">
            <span class="field-label">Phone</span>
            <span class="field-value" id="card-phone">+91 98765 43210</span>
          </div>
        </div>
      </div>

      <!-- ─── 4. FOOTER / QR ─── -->
      <div class="footer">
        <div class="qr-frame">
          <img id="card-qr" src="" alt="QR Code"
               onerror="this.style.display='none'" />
          <div class="qr-placeholder-svg">
            <svg width="36" height="36" viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg">
              <rect x="2"  y="2"  width="12" height="12" rx="1.5" fill="none" stroke="#6b1010" stroke-width="1.4"/>
              <rect x="4.5" y="4.5" width="7" height="7" fill="#6b1010"/>
              <rect x="22" y="2"  width="12" height="12" rx="1.5" fill="none" stroke="#6b1010" stroke-width="1.4"/>
              <rect x="24.5" y="4.5" width="7" height="7" fill="#6b1010"/>
              <rect x="2"  y="22" width="12" height="12" rx="1.5" fill="none" stroke="#6b1010" stroke-width="1.4"/>
              <rect x="4.5" y="24.5" width="7" height="7" fill="#6b1010"/>
              <rect x="22" y="22" width="3" height="3" fill="#6b1010"/>
              <rect x="27" y="22" width="3" height="3" fill="#6b1010"/>
              <rect x="31" y="22" width="3" height="3" fill="#6b1010"/>
              <rect x="22" y="27" width="3" height="3" fill="#6b1010"/>
              <rect x="31" y="27" width="3" height="3" fill="#6b1010"/>
              <rect x="22" y="31" width="3" height="3" fill="#6b1010"/>
              <rect x="27" y="31" width="3" height="3" fill="#6b1010"/>
              <rect x="16" y="2"  width="2.5" height="2.5" fill="#6b1010"/>
              <rect x="16" y="6"  width="2.5" height="2.5" fill="#6b1010"/>
              <rect x="16" y="10" width="2.5" height="2.5" fill="#6b1010"/>
            </svg>
          </div>
        </div>
        <div class="footer-info">
          <span class="footer-title">🆘 Emergency Help</span>
          <span class="footer-body">Scan QR for guide contact<br>&amp; emergency assistance</span>
          <div class="footer-brand">
            <span class="footer-brand-hr"></span>
            <span class="footer-brand-text">दिव्ययात्रा ®</span>
          </div>
        </div>
      </div>

    </div><!-- /safe -->
  </div><!-- /card -->
</div><!-- /bleed -->

<script>
    // 🚀 Database ke asli column names use kar rahe hain
    document.getElementById('card-name').textContent = "{{ p.name or p.full_name }}";
    document.getElementById('card-group').textContent = "{{ p.group_name }}";
    
    // City abhi DB me nahi hai, toh abhi ke liye Unknown aayega
    document.getElementById('card-age-city').textContent = "{{ p.age or '--' }} / {{ p.city or 'Unknown' }}";
    
    // Emergency contact ya phone
    // 📞 Admin ka dynamic number set kar rahe hain
    document.getElementById('card-phone').textContent = "{{ p.admin_phone or 'Admin No. Missing' }}";

    // 📸 Photo URL linking (DB: photo_path)
    const photoUrl = "{{ p.photo_path or '' }}";
    if (photoUrl && photoUrl !== "None" && photoUrl !== "NULL") { 
        document.getElementById('card-photo').src = photoUrl; 
    }

    // 🔲 QR Code linking
    const qrUrl = "{{ p.qr_code_path or p.qr_path or '' }}"; 
    if (qrUrl && qrUrl !== "None" && qrUrl !== "NULL") { 
        document.getElementById('card-qr').src = qrUrl; 
    }

    setTimeout(() => { window.print(); }, 800);
  </script>
</body>
</html>
</body>
